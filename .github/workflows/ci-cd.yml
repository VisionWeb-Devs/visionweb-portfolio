name: CI/CD

# Order matters on main: the web build prerenders pages from the live CMS, so a
# CMS release (new content types, fields) must be deployed before web is built.
#   check -> cms image -> deploy cms -> web image -> deploy web
# The CMS steps are skipped when nothing under cms/ changed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CMS_IMAGE: ghcr.io/visionweb-devs/visionweb-portfolio-cms
  WEB_IMAGE: ghcr.io/visionweb-devs/visionweb-portfolio-web
  IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    outputs:
      cms_changed: ${{ steps.changes.outputs.cms }}
      tag: ${{ steps.changes.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        name: Detect CMS changes
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cms=true" >> "$GITHUB_OUTPUT"   # first push / manual run: release everything
          elif git diff --quiet "$BEFORE"...HEAD -- cms/; then
            echo "cms=false" >> "$GITHUB_OUTPUT"
          else
            echo "cms=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npx next typegen
          npm run typecheck

  cms-image:
    name: Build CMS image
    needs: check
    if: needs.check.outputs.cms_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.IS_MAIN == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cms
          push: ${{ env.IS_MAIN == 'true' }}
          tags: |
            ${{ env.CMS_IMAGE }}:${{ needs.check.outputs.tag }}
            ${{ env.CMS_IMAGE }}:latest
          cache-from: type=gha,scope=cms
          cache-to: type=gha,scope=cms,mode=max

  deploy-cms:
    name: Deploy CMS
    needs: [check, cms-image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-visionweb-cms
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$USER@$HOST" "deploy visionweb-cms ${{ needs.check.outputs.tag }}"

  web-image:
    name: Build web image
    needs: [check, deploy-cms]
    # Runs after the CMS deploy when there was one; otherwise straight after check.
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.deploy-cms.result == 'success' || needs.deploy-cms.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.IS_MAIN == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: ${{ env.IS_MAIN == 'true' }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://visionweb.immoprodz.io' }}
            STRAPI_URL=${{ vars.STRAPI_URL || 'https://cms.visionweb.immoprodz.io' }}
            MEDIA_HOSTNAME=${{ vars.MEDIA_HOSTNAME || 'cms.visionweb.immoprodz.io' }}
          secrets: |
            strapi_token=${{ secrets.STRAPI_API_TOKEN }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ needs.check.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy-web:
    name: Deploy web
    needs: [check, web-image]
    if: >-
      always() && needs.web-image.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://visionweb.immoprodz.io' }}
    concurrency:
      group: deploy-visionweb-web
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$USER@$HOST" "deploy visionweb-web ${{ needs.check.outputs.tag }}"
